<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Atlas Earth - Claim 3 Parcels</title>
<style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#59636b}
*{-webkit-box-sizing:border-box;box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,0);-webkit-user-select:none;user-select:none}
body{font-family:"Arial Rounded MT Bold","Trebuchet MS","Helvetica Neue",Arial,sans-serif;font-weight:900;color:#fff;-webkit-text-size-adjust:100%}
.ol{text-shadow:0 .5vmin 0 #1b1f24,.35vmin .35vmin 0 #1b1f24,-.35vmin .35vmin 0 #1b1f24,.35vmin -.35vmin 0 #1b1f24,-.35vmin -.35vmin 0 #1b1f24}
.paused *,.paused *:before,.paused *:after{-webkit-animation-play-state:paused!important;animation-play-state:paused!important}

/* ---------- map ---------- */
#view{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;background:#59636b;-webkit-perspective:120vmin;perspective:120vmin}
#world{position:absolute;left:50%;top:50%;width:200vmin;height:260vmin;margin-left:-100vmin;margin-top:-150vmin;
  background-color:#68727a;
  background-image:-webkit-linear-gradient(rgba(255,255,255,.13) 2px,transparent 2px),-webkit-linear-gradient(left,rgba(255,255,255,.13) 2px,transparent 2px);
  background-image:linear-gradient(rgba(255,255,255,.13) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.13) 2px,transparent 2px);
  background-size:10% 7.6923%;-webkit-transform:rotateX(40deg);transform:rotateX(40deg)}
.road{position:absolute;height:4.2%;background:#3a3f45;border-radius:3vmin}
.road-label{position:absolute;font-size:2.2vmin;color:#dfe3e6;letter-spacing:.1vmin}
.ring{position:absolute;left:12%;top:29%;width:76%;height:58.5%;border:.5vmin solid #e8efc4;border-radius:50%;opacity:.85}
.parcel{position:absolute;width:10%;height:7.6923%}
.parcel.target{background:rgba(255,255,255,.18);-webkit-animation:glow 1s ease-in-out infinite alternate;animation:glow 1s ease-in-out infinite alternate;cursor:pointer}
.parcel.target:before,.parcel.target:after,.parcel.sel:before,.parcel.sel:after{content:"";position:absolute;width:30%;height:30%;border:.6vmin solid #fff}
.parcel.target:before,.parcel.sel:before{left:-.4vmin;top:-.4vmin;border-right:0;border-bottom:0}
.parcel.target:after,.parcel.sel:after{right:-.4vmin;bottom:-.4vmin;border-left:0;border-top:0}
.parcel.sel{background:rgba(255,255,255,.35)}
.parcel.owned{background:#72b043;background-image:-webkit-radial-gradient(30% 35%,circle,#8cc95a 0,#8cc95a 12%,transparent 13%),-webkit-radial-gradient(70% 70%,circle,#5f9a36 0,#5f9a36 10%,transparent 11%);
  background-image:radial-gradient(circle at 30% 35%,#8cc95a 0,#8cc95a 12%,transparent 13%),radial-gradient(circle at 70% 70%,#5f9a36 0,#5f9a36 10%,transparent 11%);
  border:.7vmin solid #f2b632;-webkit-animation:pop .45s ease-out;animation:pop .45s ease-out}
@-webkit-keyframes glow{from{background-color:rgba(255,255,255,.08)}to{background-color:rgba(255,255,255,.42)}}
@keyframes glow{from{background-color:rgba(255,255,255,.08)}to{background-color:rgba(255,255,255,.42)}}
@-webkit-keyframes pop{0%{-webkit-transform:scale(.6)}70%{-webkit-transform:scale(1.12)}100%{-webkit-transform:scale(1)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}

/* ---------- overlay: pins, hand, coins ---------- */
#fx{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}
.pin{position:absolute;width:10vmin;margin-left:-5vmin;-webkit-transform-origin:50% 100%;transform-origin:50% 100%;-webkit-animation:drop .5s cubic-bezier(.3,1.6,.5,1);animation:drop .5s cubic-bezier(.3,1.6,.5,1)}
.pin .face{width:10vmin;height:10vmin;border:.7vmin solid #f7d64a;border-radius:1.4vmin;background:#fff center/cover no-repeat;box-shadow:0 .6vmin 1.2vmin rgba(0,0,0,.35)}
.pin .stick{width:.7vmin;height:5vmin;margin:0 auto;background:#f7d64a}
.pin .tag{position:absolute;left:50%;top:-5vmin;white-space:nowrap;-webkit-transform:translateX(-50%);transform:translateX(-50%);font-size:2.6vmin;background:#1b1f24;padding:.6vmin 1.4vmin;border-radius:1vmin}
@-webkit-keyframes drop{0%{-webkit-transform:translateY(-12vmin) scale(.4);opacity:0}100%{-webkit-transform:none;opacity:1}}
@keyframes drop{0%{transform:translateY(-12vmin) scale(.4);opacity:0}100%{transform:none;opacity:1}}
.hand{position:absolute;width:13vmin;height:13vmin;margin:-2vmin 0 0 -3vmin;display:none;z-index:30}
.hand svg{width:100%;height:100%;-webkit-animation:tap 1s ease-in-out infinite;animation:tap 1s ease-in-out infinite}
.hand:before{content:"";position:absolute;left:-2.5vmin;top:-2.5vmin;width:10vmin;height:10vmin;border-radius:50%;border:.6vmin solid #fff;opacity:0;-webkit-animation:ring 1s ease-out infinite;animation:ring 1s ease-out infinite}
@-webkit-keyframes tap{0%,100%{-webkit-transform:translate(2vmin,2vmin)}50%{-webkit-transform:translate(0,0) scale(.92)}}
@keyframes tap{0%,100%{transform:translate(2vmin,2vmin)}50%{transform:translate(0,0) scale(.92)}}
@-webkit-keyframes ring{0%,45%{-webkit-transform:scale(.3);opacity:0}55%{opacity:.9}100%{-webkit-transform:scale(1.2);opacity:0}}
@keyframes ring{0%,45%{transform:scale(.3);opacity:0}55%{opacity:.9}100%{transform:scale(1.2);opacity:0}}
.coin{position:absolute;width:4vmin;height:4vmin;margin:-2vmin;border-radius:50%;background:#f7c53a;border:.5vmin solid #c98a12;-webkit-transition:-webkit-transform .9s ease-out,opacity .9s ease-in;transition:transform .9s ease-out,opacity .9s ease-in}

/* ---------- HUD (mirrors current in-game UI) ---------- */
#hud{position:absolute;top:3vmin;left:3vmin;right:3vmin;height:17vmin;z-index:20;-webkit-transition:-webkit-transform .5s;transition:transform .5s}
#hud.hide{-webkit-transform:translateY(-30vmin);transform:translateY(-30vmin)}
.bar{position:absolute;left:5vmin;right:21vmin;top:0;height:16vmin;background:#f4e9cf;border:.6vmin solid #b99c69;border-radius:3vmin;box-shadow:0 .8vmin 0 rgba(0,0,0,.2)}
.avatar{position:absolute;left:0;top:.5vmin;width:15vmin;height:15vmin;border-radius:50%;border:1vmin solid #5b4630;background:#fff center/cover no-repeat;z-index:2}
#rent{position:absolute;left:12.5vmin;right:1.5vmin;top:1.6vmin;height:7vmin;line-height:7vmin;background:#fff;border:.4vmin solid #d7c7a4;border-radius:1.6vmin;padding-left:1.4vmin;color:#2f7fd1;font-size:4.4vmin;white-space:nowrap;overflow:hidden;letter-spacing:-.1vmin}
#rent.up{-webkit-animation:flash .35s;animation:flash .35s}
@-webkit-keyframes flash{50%{background:#e6f7d8}}
@keyframes flash{50%{background:#e6f7d8}}
.pills{position:absolute;left:12.5vmin;top:9.6vmin;right:1.5vmin;height:4.8vmin}
.pill{position:relative;display:inline-block;width:44%;height:4.8vmin;line-height:4.4vmin;background:#fff;border:.4vmin solid #d7c7a4;border-radius:2.4vmin;color:#54483a;font-size:3.2vmin;text-align:right;padding-right:2vmin;margin-right:3%}
.pill i{position:absolute;left:-1.4vmin;top:-.9vmin;width:6.4vmin;height:6.4vmin;border-radius:50%;background:#46a64a;border:.5vmin solid #2c6e2f;color:#fff;font-style:normal;text-align:center;line-height:5.2vmin;font-size:3.6vmin}
.pill i.gem{background:#62b8f0;border-color:#2f79b0;border-radius:1vmin;-webkit-transform:rotate(45deg) scale(.8);transform:rotate(45deg) scale(.8)}
#boost{position:absolute;right:0;top:0;width:18.5vmin;height:16vmin;background:#f7a92a;background-image:-webkit-linear-gradient(#ffc84a,#f08f18);background-image:linear-gradient(#ffc84a,#f08f18);border:.6vmin solid #8a5210;border-radius:2.4vmin;text-align:center;font-size:3.4vmin;line-height:3.8vmin;padding-top:5.4vmin;box-shadow:0 .8vmin 0 rgba(0,0,0,.2)}
#boost:before{content:"";position:absolute;left:50%;top:1vmin;margin-left:-2vmin;border-left:2vmin solid transparent;border-right:1vmin solid transparent;border-bottom:4vmin solid #fff;-webkit-transform:skewX(-18deg);transform:skewX(-18deg)}
#boost.lit{-webkit-animation:lit .6s ease-in-out infinite alternate;animation:lit .6s ease-in-out infinite alternate}
@-webkit-keyframes lit{to{-webkit-transform:scale(1.08);box-shadow:0 0 4vmin #ffe27a}}
@keyframes lit{to{transform:scale(1.08);box-shadow:0 0 4vmin #ffe27a}}

/* ---------- bottom: BUY LAND, nav, disclaimer ---------- */
#buy{position:absolute;left:50%;bottom:27vmin;width:56vmin;margin-left:-28vmin;height:13vmin;line-height:11vmin;text-align:center;font-size:7vmin;color:#fff;background:#f39a26;background-image:-webkit-linear-gradient(#ffb547,#e57f12);background-image:linear-gradient(#ffb547,#e57f12);border:.8vmin solid #fff;box-shadow:0 0 0 .7vmin #7a4410,0 1.4vmin 0 #7a4410;border-radius:2.4vmin;display:none;z-index:25;cursor:pointer;-webkit-animation:pulse .8s ease-in-out infinite alternate;animation:pulse .8s ease-in-out infinite alternate}
@-webkit-keyframes pulse{to{-webkit-transform:scale(1.06)}}
@keyframes pulse{to{transform:scale(1.06)}}
#nav{position:absolute;left:0;right:0;bottom:0;height:15vmin;background:#efe2c4;border-top:.6vmin solid #c9ad7a;z-index:20;display:-webkit-box;display:-webkit-flex;display:flex}
#nav div{-webkit-box-flex:1;-webkit-flex:1;flex:1;text-align:center;color:#8a7a62;font-size:2.9vmin;padding-top:9.2vmin;position:relative}
#nav div:before{content:"";position:absolute;left:50%;top:1.6vmin;width:7vmin;height:7vmin;margin-left:-3.5vmin;border-radius:1.8vmin;background:#c9a14a}
#nav .on{background:#3f8fd8;color:#fff;margin-top:-3vmin;border-radius:2vmin 2vmin 0 0;border:.6vmin solid #26629c;border-bottom:0;padding-top:12.2vmin}
#nav .on:before{top:3vmin;background:#f3d27a}
#nav .n1:before{background:#e8b93a}#nav .n2:before{background:#b067d8}#nav .n4:before{background:#d8563e}#nav .n5:before{background:#e58a2c}
#disc{position:absolute;left:0;right:0;bottom:15vmin;z-index:21;padding:.9vmin 2vmin;background:rgba(0,0,0,.45);font:700 1.9vmin/1.25 Arial,sans-serif;text-align:center;color:#fff;letter-spacing:.02vmin}

/* ---------- captions ---------- */
#topstack{position:absolute;left:5vmin;right:5vmin;top:22vmin;z-index:22;text-align:center;pointer-events:none}
#cap{position:relative;text-align:center;font-size:6.6vmin;line-height:1.18;opacity:0;-webkit-transition:opacity .3s,-webkit-transform .3s;transition:opacity .3s,transform .3s;-webkit-transform:translateY(2vmin);transform:translateY(2vmin);pointer-events:none}
#cap.on{opacity:1;-webkit-transform:none;transform:none}
#cap .hl{background:#7b2ff7;padding:0 1.2vmin;border-radius:1vmin;text-shadow:none}
#cap .sub{display:block;font-size:4.4vmin;margin-top:1.6vmin;color:#ffe36b}
#cap.bubble span.b{display:inline-block;background:#fff;color:#1b1f24;text-shadow:none;padding:2.4vmin 3.4vmin;border-radius:4vmin;position:relative;box-shadow:0 1vmin 0 rgba(0,0,0,.25)}
#cap.bubble span.b:after{content:"";position:absolute;left:18%;bottom:-3vmin;border-left:2vmin solid transparent;border-right:2vmin solid transparent;border-top:3.4vmin solid #fff}
#prog{position:relative;margin:0 0 1.6vmin;background:rgba(27,31,36,.75);padding:.8vmin 2.6vmin;border-radius:3vmin;font-size:3.4vmin;display:none;white-space:nowrap}

/* ---------- end card ---------- */
#end{position:absolute;top:0;left:0;right:0;bottom:0;z-index:50;display:none;background:#39aee8;background-image:-webkit-linear-gradient(#2d9fe0,#7fd3fa);background-image:linear-gradient(#2d9fe0,#7fd3fa);text-align:center;overflow:hidden}
#end .ol{text-shadow:.35vmin .35vmin 0 #0f4f86,-.35vmin .35vmin 0 #0f4f86,.35vmin -.35vmin 0 #0f4f86,-.35vmin -.35vmin 0 #0f4f86,0 .35vmin 0 #0f4f86,0 -.35vmin 0 #0f4f86}
#end .cloud{position:absolute;background:#fff;border-radius:20vmin;opacity:.9}
#end .cloud:before,#end .cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
#end .c1{left:-6vmin;bottom:18%;width:40vmin;height:10vmin}#end .c1:before{left:8vmin;top:-7vmin;width:16vmin;height:16vmin}#end .c1:after{left:20vmin;top:-4vmin;width:12vmin;height:12vmin}
#end .c2{right:-8vmin;bottom:9%;width:46vmin;height:11vmin}#end .c2:before{left:10vmin;top:-8vmin;width:18vmin;height:18vmin}#end .c2:after{left:24vmin;top:-5vmin;width:13vmin;height:13vmin}
#end .c3{right:10%;top:5%;width:26vmin;height:7vmin;opacity:.6}#end .c3:before{left:5vmin;top:-5vmin;width:11vmin;height:11vmin}#end .c3:after{left:13vmin;top:-3vmin;width:8vmin;height:8vmin}
#end.on{display:block;-webkit-animation:fade .5s;animation:fade .5s}
@-webkit-keyframes fade{from{opacity:0}}
@keyframes fade{from{opacity:0}}
#end .col{position:absolute;left:6vmin;right:6vmin;top:19%;z-index:2}
#end .logo{width:62vmin;max-width:80%;-webkit-animation:float 2.4s ease-in-out infinite alternate;animation:float 2.4s ease-in-out infinite alternate}
@-webkit-keyframes float{to{-webkit-transform:translateY(-1.6vmin) rotate(-1.5deg)}}
@keyframes float{to{transform:translateY(-1.6vmin) rotate(-1.5deg)}}
#end h1{margin:3vmin 0 0;font-size:7.4vmin;line-height:1.1}
#end h2{margin:3vmin 0 0;font-size:5.4vmin;line-height:1.15;color:#ffe36b}

#end .recap{display:inline-block;margin-top:3.5vmin;background:rgba(15,79,134,.55);border-radius:3vmin;padding:1.4vmin 3vmin;font-size:3.6vmin}
#cta{display:block;margin:5vmin auto 0;width:66vmin;max-width:90%;height:14vmin;border:0;border-radius:3vmin;background:#22cff3;background-image:-webkit-linear-gradient(#5fe6ff,#12b6e0);background-image:linear-gradient(#5fe6ff,#12b6e0);box-shadow:0 1.3vmin 0 #0a7fa3;color:#fff;font:900 7.4vmin/14vmin "Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;cursor:pointer;-webkit-animation:pulse .7s ease-in-out infinite alternate;animation:pulse .7s ease-in-out infinite alternate}

/* short portrait phones (iPhone SE class): smaller character so it clears the CTA */
@media (orientation:portrait) and (min-aspect-ratio:9/17){#end .col{top:8%}}
/* squat portrait (tablets): compact end-card column so the character never reaches the CTA */
@media (orientation:portrait) and (min-aspect-ratio:2/3){#end .col{top:5%}#end .logo{width:44vmin}#end h1{font-size:6.4vmin}#end h2{font-size:4.6vmin}#cta{height:12vmin;line-height:12vmin;font-size:6.4vmin}}

/* landscape: map fills, HUD narrower, end card in two columns */
@media (orientation:landscape){
  #hud{left:50%;right:auto;width:96vmin;margin-left:-48vmin}
  #world{margin-top:-140vmin}
  #topstack{top:20vmin}
  #cap{font-size:5.6vmin}
  #buy{bottom:22.5vmin;height:10vmin;line-height:8.4vmin;font-size:5.6vmin;width:46vmin;margin-left:-23vmin}
  #nav{left:50%;right:auto;width:110vmin;margin-left:-55vmin;border-left:.6vmin solid #c9ad7a;border-right:.6vmin solid #c9ad7a;border-radius:2vmin 2vmin 0 0}
  #disc{left:50%;right:auto;width:110vmin;margin-left:-55vmin}
  #end .col{left:8vmin;right:8vmin;top:6%}
  #end .logo{width:46vmin}
  #end h1{font-size:6.4vmin}#end h2{font-size:4.6vmin}
  #cta{margin-top:3.5vmin;height:12vmin;line-height:12vmin;font-size:6.4vmin;width:60vmin}
}
.parcel.other{background:#6a9a4c;border:.5vmin solid #d9b54a;opacity:.7}
</style>
</head>

<script>/* Atlas Earth playable core: MRAID lifecycle, pause-aware timers, rent ticker, map/pin/hand helpers. ES5 only. */
var AE = (function () {
  var STORE = {
    iOS: 'https://apps.apple.com/us/app/atlas-earth-fun-cashback/id1567636697',
    Android: 'https://play.google.com/store/apps/details?id=ci.atlasearth.client'
  };
  var paused = false, started = false, timers = [], tracked = [], last = 0;
  var rent = 0, rate = 0, bucks = 300, rentEl, lastTxt = '';
  function $(id) { return document.getElementById(id); }

  // ---- pause-aware scheduler (timers only advance while viewable). setInterval, not rAF, so a throttled
  // rAF in a background webview can never strand the flow mid-way. ----
  function after(ms, fn) { timers.push({ t: ms, fn: fn }); }
  function loop() {
    var ts = +new Date(), dt = last ? Math.min(ts - last, 100) : 33; last = ts;
    if (paused || !started) return;
    var due = [];
    for (var i = timers.length - 1; i >= 0; i--) { timers[i].t -= dt; if (timers[i].t <= 0) { due.push(timers[i].fn); timers.splice(i, 1); } }
    for (var j = due.length - 1; j >= 0; j--) due[j]();
    rent += rate * dt / 1000;
    var txt = '$' + rent.toFixed(13);
    if (txt !== lastTxt) { rentEl.innerHTML = txt; lastTxt = txt; }
  }

  // ---- rent + bucks ----
  function setRate(r) { rate = r; rentEl.className = ''; void rentEl.offsetWidth; rentEl.className = 'up'; }
  function spend(n) { bucks -= n; $('bucks').innerHTML = bucks; }
  function setBucks(n) { bucks = n; $('bucks').innerHTML = n; }

  // ---- map helpers ----
  function parcel(col, row, cls) {
    var d = document.createElement('div');
    d.className = 'parcel ' + (cls || '');
    d.style.left = (col * 10) + '%'; d.style.top = (row * 100 / 13) + '%';
    $('world').appendChild(d); return d;
  }
  function center(el) {
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }
  function place(node, el, dy) {
    var c = center(el); node.style.left = c.x + 'px'; node.style.top = (c.y + (dy || 0)) + 'px';
  }
  function track(node, el, fn) { tracked.push({ node: node, el: el, fn: fn }); fn(); }
  function relayout() { for (var i = 0; i < tracked.length; i++) tracked[i].fn(); }

  function pin(el, img, tag) {
    var p = document.createElement('div'); p.className = 'pin';
    p.innerHTML = (tag ? '<div class="tag">' + tag + '</div>' : '') +
      '<div class="face" style="background-image:url(' + img + ')"></div><div class="stick"></div>';
    $('fx').appendChild(p);
    track(p, el, function () { var c = center(el); p.style.left = c.x + 'px'; p.style.top = (c.y - p.offsetHeight) + 'px'; });
    return p;
  }
  var handTarget = null;
  function hand(el) {
    var h = $('hand'); handTarget = el;
    if (!el) { h.style.display = 'none'; return; }
    h.style.display = 'block'; place(h, el);
  }
  function coins(el) {
    var c = center(el), fx = $('fx');
    for (var i = 0; i < 8; i++) (function (i) {
      var k = document.createElement('div'); k.className = 'coin';
      k.style.left = c.x + 'px'; k.style.top = c.y + 'px'; fx.appendChild(k);
      var dx = (i - 3.5) * 3.2, dy = -14 - (i % 3) * 5;
      setTimeout(function () {
        var t = 'translate(' + dx + 'vmin,' + dy + 'vmin)';
        k.style.webkitTransform = t; k.style.transform = t; k.style.opacity = '0';
      }, 30);
      setTimeout(function () { if (k.parentNode) fx.removeChild(k); }, 1100);
    })(i);
  }

  // ---- captions / progress / buy / end ----
  function caption(html, cls) {
    var c = $('cap');
    if (!html) { c.className = 'ol'; return; }
    c.innerHTML = html; c.className = 'ol ' + (cls || '');
    void c.offsetWidth; c.className = 'ol on ' + (cls || '');
  }
  function prog(txt) { var p = $('prog'); p.style.display = txt ? 'inline-block' : 'none'; p.innerHTML = txt || ''; }
  function once(el, fn) {
    function h(e) { if (paused) return; el.removeEventListener('click', h); fn(e); }
    el.addEventListener('click', h);
  }
  function buy(cb) {
    var b = $('buy'); b.style.display = 'block'; hand(b);
    once(b, function () { b.style.display = 'none'; hand(null); cb(); });
  }
  function end(recap) {
    hand(null); caption(null); prog(null);
    $('recap').innerHTML = recap || ''; $('recap').style.display = recap ? 'inline-block' : 'none';
    $('end').className = 'on';
  }

  // ---- store ----
  function platform() { return /iphone|ipad|ipod/i.test(navigator.userAgent) ? 'iOS' : 'Android'; }
  function openStore() {
    var url = STORE[platform()];
    if (typeof mraid !== 'undefined') mraid.open(url); else window.open(url, '_blank');
  }

  // ---- MRAID lifecycle: nothing starts until viewable; pause when hidden ----
  var game;
  function setPaused(p) { paused = p; document.body.className = p ? 'paused' : ''; }
  function showAd() {
    if (started) { setPaused(false); return; }
    started = true; setPaused(false); game();
  }
  function onViewableChange(v) { if (v) showAd(); else setPaused(true); }
  function boot(fn) {
    game = fn; rentEl = $('rent');
    $('cta').addEventListener('click', openStore);
    window.addEventListener('resize', function () { relayout(); if (handTarget) place($('hand'), handTarget); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) setPaused(true);
      else if (started && (typeof mraid === 'undefined' || mraid.isViewable())) setPaused(false);
    });
    setInterval(loop, 33);
    if (typeof mraid === 'undefined') { showAd(); return; } // local browser preview only
    function ready() {
      mraid.addEventListener('viewableChange', onViewableChange);
      if (mraid.isViewable()) showAd();
    }
    if (mraid.getState() === 'loading') mraid.addEventListener('ready', ready); else ready();
  }

  return { $: $, after: after, setRate: setRate, spend: spend, setBucks: setBucks, parcel: parcel, pin: pin,
    hand: hand, coins: coins, caption: caption, prog: prog, once: once, buy: buy, end: end, boot: boot,
    isPaused: function () { return paused; } };
})();
</script>

var SPOTS = [[4, 7], [5, 7], [3, 7]];
var RATE = 0.0000052; // rent per parcel per second, shown to 13 decimals like the in-game ticker
var owned = 0;

function next() {
  var s = SPOTS[owned], p = AE.parcel(s[0], s[1], 'target');
  AE.hand(p);
  AE.once(p, function () {
    p.className = 'parcel sel';
    if (owned === 0) AE.caption('Now hit <span class="hl">BUY LAND</span>');
    AE.buy(function () { claim(p); });
  });
}

function claim(p) {
  owned++;
  p.className = 'parcel owned';
  AE.pin(p, AVATAR);
  AE.coins(p);
  AE.spend(100);
  AE.setRate(RATE * owned);
  AE.prog('Parcels ' + owned + '/3');
  if (owned === 1) AE.caption('It’s already <span class="hl">earning rent.</span><span class="sub">Grab 2 more</span>');
  if (owned === 2) AE.caption('Rent just <span class="hl">doubled.</span><span class="sub">One more</span>');
  if (owned < 3) { AE.after(700, next); return; }
  AE.caption('3 parcels.<br><span class="hl">3x the rent.</span>');
  AE.$('boost').className = 'lit';
  AE.after(2400, function () { AE.end(); });
}

AE.boot(function () {
  AE.caption('<span class="b">“Digital land that pays rent?<br>Yeah, right.”</span>', 'bubble');
  AE.after(500, function () { AE.$('hud').className = ''; });
  AE.after(1300, function () {
    AE.caption('Tap a parcel to <span class="hl">claim it</span>');
    AE.prog('Parcels 0/3');
    next();
  });
});
